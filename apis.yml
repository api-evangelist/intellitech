aid: intellitech
name: Intellitech
description: >-
  Intellitech Corporation is a semiconductor test and design-for-test company
  based in Rochester, New Hampshire, specializing in IEEE 1149.1 (JTAG)
  boundary-scan technology. Its products include the Eclipse boundary-scan test
  development environment, the Scan Executive production test platform, and
  concurrent JTAG hardware testers such as the PT100 and JAF Pro, used for
  printed circuit board (PCB) testing, in-system FLASH programming, and FPGA
  configuration. Intellitech is an early Battery Ventures ("Battery Ventures I")
  portfolio company in the semiconductor sector. The company publishes product,
  legal, and customer-account pages on its website but does not expose a public
  developer API, OpenAPI definition, SDKs, or MCP surface.
